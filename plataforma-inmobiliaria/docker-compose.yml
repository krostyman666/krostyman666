version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inmobiliaria_postgres
    environment:
      POSTGRES_USER: immobiliary_user
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: inmobiliaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inmobiliaria_network

  redis:
    image: redis:7-alpine
    container_name: inmobiliaria_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inmobiliaria_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inmobiliaria_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inmobiliaria.local
      PGADMIN_DEFAULT_PASSWORD: change_me_in_production
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - inmobiliaria_network

volumes:
  postgres_data:
  redis_data:

networks:
  inmobiliaria_network:
    driver: bridge
